<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; color: #c8dfda; font: 13px "Segoe UI", Arial, sans-serif; }
      button { border: 1px solid #14b8a6; border-radius: 10px; background: linear-gradient(110deg,#0f766e,#0d9488); color: white;
        cursor: pointer; font-weight: 650; padding: 11px 15px; transition: transform .16s, box-shadow .16s; }
      button:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(13,148,136,.25); }
      button:disabled { cursor: wait; opacity: .7; }
      #message { margin-left: 10px; color: #9aadaa; }
    </style>
  </head>
  <body>
      <button id="locate" type="button">⌖ &nbsp;Use current location</button>
    <span id="message">Your browser will ask for permission.</span>
    <script>
      const button = document.getElementById("locate");
      const message = document.getElementById("message");
      const send = (type, data = {}) => {
        window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*");
      };
      send("streamlit:componentReady", {apiVersion: 1});
      send("streamlit:setFrameHeight", {height: 48});

      button.addEventListener("click", () => {
        if (!navigator.geolocation) {
          message.textContent = "Geolocation is not supported by this browser.";
          return;
        }
        button.disabled = true;
        message.textContent = "Requesting location permission...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const value = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy
            };
            message.textContent = `Location captured (${value.latitude.toFixed(5)}, ${value.longitude.toFixed(5)}).`;
            button.disabled = false;
            send("streamlit:setComponentValue", {value});
          },
          (error) => {
            message.textContent = error.message || "Could not access your location.";
            button.disabled = false;
          },
          {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000}
        );
      });
    </script>
  </body>
</html>
